- id: harness-autonomy
  name: harness-autonomy
  description: Decidable checks for an auto-merge policy (block and policy rules; exit 1 FAIL, 2 REVIEW_REQUIRED; no LLM)
  entry: harness-eval harness-autonomy .
  language: python
  pass_filenames: false
  always_run: false
  files: >-
    (?x)(
      CLAUDE\.md|AGENTS\.md|GEMINI\.md|
      \.cursorrules|\.clinerules|\.windsurfrules|
      skills/|commands/|agents/|harness/|
      \.claude/|\.cursor/|\.opencode/|\.codex/|\.gemini/|\.lola/|
      \.mcp\.json
    )
  stages: [pre-commit]

