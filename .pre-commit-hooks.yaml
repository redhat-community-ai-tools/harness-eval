- id: harness-gate
  name: harness-gate
  description: Gate AI agent setup files on corpus-validated rules (exits 1 on any finding, no LLM)
  entry: harness-eval harness-gate .
  language: python
  pass_filenames: false
  always_run: false
  files: >-
    (?x)(
      CLAUDE\.md|AGENTS\.md|GEMINI\.md|
      \.cursorrules|\.clinerules|\.windsurfrules|
      skills/|commands/|
      \.claude/|\.cursor/|\.opencode/|\.codex/|\.gemini/|\.lola/|
      \.mcp\.json
    )
  stages: [pre-commit]

