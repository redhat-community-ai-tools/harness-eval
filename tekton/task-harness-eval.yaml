apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: harness-eval
  labels:
    app.kubernetes.io/version: "7.13.0"
  annotations:
    tekton.dev/displayName: "harness-eval"
    tekton.dev/categories: Security
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Static analysis for AI code agent configurations.
    Scans skills, hooks, MCP configs, and agent definitions
    for security, quality, and best-practice issues.
  workspaces:
    - name: source
      description: Workspace containing the cloned repository to scan.
  params:
    - name: image
      type: string
      default: registry.access.redhat.com/ubi9/python-312:latest
      description: >-
        Container image. Default installs harness-eval at runtime via pip.
        For air-gapped clusters, build from the included Containerfile.
    - name: path
      type: string
      default: "."
      description: Subdirectory within the workspace to scan.
    - name: commands
      type: string
      default: "gate,lint,security"
      description: Comma-separated commands to run (gate, lint, security).
    - name: enforce
      type: string
      default: "strict"
      description: "Enforcement mode: strict (fail on findings), advisory (report only), off (skip)."
      enum: ["strict", "advisory", "off"]
    - name: format
      type: string
      default: "terminal"
      description: "Output format: terminal, json, sarif."
      enum: ["terminal", "json", "sarif"]
    - name: recursive
      type: string
      default: "false"
      description: Recursively search subdirectories for agent configs.
      enum: ["true", "false"]
    - name: exclude
      type: string
      default: ""
      description: "Comma-separated glob patterns to exclude from scanning."
  results:
    - name: verdict
      description: "Overall result: CLEAN, NEEDS_WORK, or BLOCKED."
    - name: grade
      description: "Report card grade: A through F."
  steps:
    - name: gate
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tmp
        - name: PARAM_COMMANDS
          value: $(params.commands)
        - name: PARAM_PATH
          value: $(params.path)
        - name: PARAM_FORMAT
          value: $(params.format)
        - name: PARAM_RECURSIVE
          value: $(params.recursive)
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if ! echo "${PARAM_COMMANDS}" | grep -q "gate"; then
          echo "Skipping gate (not in commands list)"
          exit 0
        fi

        if ! command -v harness-eval &>/dev/null; then
          pip install --quiet --no-cache-dir harness-eval
        fi

        SCAN_PATH="${WORKSPACE_PATH}/${PARAM_PATH}"

        CMD=(harness-eval harness-gate "${SCAN_PATH}")
        if [ "${PARAM_FORMAT}" = "json" ] || [ "${PARAM_FORMAT}" = "sarif" ]; then
          CMD+=(--format "${PARAM_FORMAT}")
        fi
        if [ "${PARAM_RECURSIVE}" = "true" ]; then
          CMD+=(--recursive)
        fi

        echo "Running: ${CMD[*]}"
        "${CMD[@]}" || GATE_EXIT=$?
        echo "${GATE_EXIT:-0}" > "${WORKSPACE_PATH}/.harness-eval-gate-exit"

    - name: lint
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tmp
        - name: PARAM_COMMANDS
          value: $(params.commands)
        - name: PARAM_PATH
          value: $(params.path)
        - name: PARAM_ENFORCE
          value: $(params.enforce)
        - name: PARAM_FORMAT
          value: $(params.format)
        - name: PARAM_RECURSIVE
          value: $(params.recursive)
        - name: PARAM_EXCLUDE
          value: $(params.exclude)
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if ! echo "${PARAM_COMMANDS}" | grep -q "lint"; then
          echo "Skipping lint (not in commands list)"
          exit 0
        fi

        if ! command -v harness-eval &>/dev/null; then
          pip install --quiet --no-cache-dir harness-eval
        fi

        SCAN_PATH="${WORKSPACE_PATH}/${PARAM_PATH}"

        CMD=(harness-eval harness-lint "${SCAN_PATH}")
        CMD+=(--enforce "${PARAM_ENFORCE}")
        CMD+=(--format "${PARAM_FORMAT}")
        CMD+=(--report-card "${WORKSPACE_PATH}/harness-eval-report-card.json")

        if [ "${PARAM_RECURSIVE}" = "true" ]; then
          CMD+=(--recursive)
        fi

        if [ -n "${PARAM_EXCLUDE}" ]; then
          IFS=',' read -ra PATTERNS <<< "${PARAM_EXCLUDE}"
          for pat in "${PATTERNS[@]}"; do
            CMD+=(--exclude "${pat}")
          done
        fi

        echo "Running: ${CMD[*]}"
        "${CMD[@]}" || LINT_EXIT=$?
        echo "${LINT_EXIT:-0}" > "${WORKSPACE_PATH}/.harness-eval-lint-exit"

    - name: security
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tmp
        - name: PARAM_COMMANDS
          value: $(params.commands)
        - name: PARAM_PATH
          value: $(params.path)
        - name: PARAM_ENFORCE
          value: $(params.enforce)
        - name: PARAM_FORMAT
          value: $(params.format)
        - name: PARAM_RECURSIVE
          value: $(params.recursive)
        - name: PARAM_EXCLUDE
          value: $(params.exclude)
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if ! echo "${PARAM_COMMANDS}" | grep -q "security"; then
          echo "Skipping security (not in commands list)"
          exit 0
        fi

        if ! command -v harness-eval &>/dev/null; then
          pip install --quiet --no-cache-dir harness-eval
        fi

        SCAN_PATH="${WORKSPACE_PATH}/${PARAM_PATH}"

        CMD=(harness-eval harness-security "${SCAN_PATH}")
        CMD+=(--enforce "${PARAM_ENFORCE}")
        CMD+=(--format "${PARAM_FORMAT}")

        if [ "${PARAM_RECURSIVE}" = "true" ]; then
          CMD+=(--recursive)
        fi

        if [ -n "${PARAM_EXCLUDE}" ]; then
          IFS=',' read -ra PATTERNS <<< "${PARAM_EXCLUDE}"
          for pat in "${PATTERNS[@]}"; do
            CMD+=(--exclude "${pat}")
          done
        fi

        echo "Running: ${CMD[*]}"
        "${CMD[@]}" || SEC_EXIT=$?
        echo "${SEC_EXIT:-0}" > "${WORKSPACE_PATH}/.harness-eval-security-exit"

    - name: extract-results
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tmp
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        REPORT="${WORKSPACE_PATH}/harness-eval-report-card.json"

        if [ -f "${REPORT}" ]; then
          VERDICT=$(python3 -c "
        import json, sys
        with open(sys.argv[1]) as f:
            r = json.load(f)
        print(r.get('verdict', 'UNKNOWN'))
        " "${REPORT}" 2>/dev/null || echo "UNKNOWN")

          GRADE=$(python3 -c "
        import json, sys
        with open(sys.argv[1]) as f:
            r = json.load(f)
        print(r.get('grade', 'N/A'))
        " "${REPORT}" 2>/dev/null || echo "N/A")
        else
          VERDICT="UNKNOWN"
          GRADE="N/A"
        fi

        printf "%s" "${VERDICT}" > $(results.verdict.path)
        printf "%s" "${GRADE}" > $(results.grade.path)
        echo "Verdict: ${VERDICT} | Grade: ${GRADE}"

        GATE_EXIT_FILE="${WORKSPACE_PATH}/.harness-eval-gate-exit"
        LINT_EXIT_FILE="${WORKSPACE_PATH}/.harness-eval-lint-exit"
        SEC_EXIT_FILE="${WORKSPACE_PATH}/.harness-eval-security-exit"
        EXIT=0
        if [ -f "${GATE_EXIT_FILE}" ] && [ "$(cat "${GATE_EXIT_FILE}")" != "0" ]; then
          echo "Gate step failed with exit code $(cat "${GATE_EXIT_FILE}")"
          EXIT=$(cat "${GATE_EXIT_FILE}")
        fi
        if [ -f "${LINT_EXIT_FILE}" ] && [ "$(cat "${LINT_EXIT_FILE}")" != "0" ]; then
          echo "Lint step failed with exit code $(cat "${LINT_EXIT_FILE}")"
          EXIT=$(cat "${LINT_EXIT_FILE}")
        fi
        if [ -f "${SEC_EXIT_FILE}" ] && [ "$(cat "${SEC_EXIT_FILE}")" != "0" ]; then
          echo "Security step failed with exit code $(cat "${SEC_EXIT_FILE}")"
          EXIT=$(cat "${SEC_EXIT_FILE}")
        fi
        exit "${EXIT}"
