apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: harness-eval
  labels:
    app.kubernetes.io/version: "7.7.1"
  annotations:
    tekton.dev/displayName: "harness-eval"
    tekton.dev/categories: Security
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Static analysis for AI code agent configurations.
    Scans skills, hooks, MCP configs, and agent definitions
    for security, quality, and best-practice issues.
  workspaces:
    - name: source
      description: Workspace containing the cloned repository to scan.
  params:
    - name: image
      type: string
      description: >-
        Container image for harness-eval. Build from the included
        Containerfile and push to your own registry.
    - name: path
      type: string
      default: "."
      description: Subdirectory within the workspace to scan.
    - name: commands
      type: string
      default: "lint,security"
      description: Comma-separated commands to run (lint, security).
    - name: enforce
      type: string
      default: "strict"
      description: "Enforcement mode: strict (fail on findings), advisory (report only), off (skip)."
      enum: ["strict", "advisory", "off"]
    - name: format
      type: string
      default: "terminal"
      description: "Output format: terminal, json, sarif."
      enum: ["terminal", "json", "sarif"]
    - name: recursive
      type: string
      default: "false"
      description: Recursively search subdirectories for agent configs.
      enum: ["true", "false"]
    - name: exclude
      type: string
      default: ""
      description: "Comma-separated glob patterns to exclude from scanning."
  results:
    - name: verdict
      description: "Overall result: CLEAN, NEEDS_WORK, or BLOCKED."
    - name: grade
      description: "Report card grade: A through F."
  steps:
    - name: lint
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tmp
        - name: PARAM_COMMANDS
          value: $(params.commands)
        - name: PARAM_PATH
          value: $(params.path)
        - name: PARAM_ENFORCE
          value: $(params.enforce)
        - name: PARAM_FORMAT
          value: $(params.format)
        - name: PARAM_RECURSIVE
          value: $(params.recursive)
        - name: PARAM_EXCLUDE
          value: $(params.exclude)
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if ! echo "${PARAM_COMMANDS}" | grep -q "lint"; then
          echo "Skipping lint (not in commands list)"
          exit 0
        fi

        SCAN_PATH="${WORKSPACE_PATH}/${PARAM_PATH}"

        CMD=(harness-eval harness-lint "${SCAN_PATH}")
        CMD+=(--enforce "${PARAM_ENFORCE}")
        CMD+=(--format "${PARAM_FORMAT}")
        CMD+=(--report-card "${WORKSPACE_PATH}/harness-eval-report-card.json")

        if [ "${PARAM_RECURSIVE}" = "true" ]; then
          CMD+=(--recursive)
        fi

        if [ -n "${PARAM_EXCLUDE}" ]; then
          IFS=',' read -ra PATTERNS <<< "${PARAM_EXCLUDE}"
          for pat in "${PATTERNS[@]}"; do
            CMD+=(--exclude "${pat}")
          done
        fi

        echo "Running: ${CMD[*]}"
        "${CMD[@]}"

    - name: security
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tmp
        - name: PARAM_COMMANDS
          value: $(params.commands)
        - name: PARAM_PATH
          value: $(params.path)
        - name: PARAM_ENFORCE
          value: $(params.enforce)
        - name: PARAM_FORMAT
          value: $(params.format)
        - name: PARAM_RECURSIVE
          value: $(params.recursive)
        - name: PARAM_EXCLUDE
          value: $(params.exclude)
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if ! echo "${PARAM_COMMANDS}" | grep -q "security"; then
          echo "Skipping security (not in commands list)"
          exit 0
        fi

        SCAN_PATH="${WORKSPACE_PATH}/${PARAM_PATH}"

        CMD=(harness-eval harness-security "${SCAN_PATH}")
        CMD+=(--enforce "${PARAM_ENFORCE}")
        CMD+=(--format "${PARAM_FORMAT}")

        if [ "${PARAM_RECURSIVE}" = "true" ]; then
          CMD+=(--recursive)
        fi

        if [ -n "${PARAM_EXCLUDE}" ]; then
          IFS=',' read -ra PATTERNS <<< "${PARAM_EXCLUDE}"
          for pat in "${PATTERNS[@]}"; do
            CMD+=(--exclude "${pat}")
          done
        fi

        echo "Running: ${CMD[*]}"
        "${CMD[@]}"

    - name: extract-results
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tmp
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        REPORT="${WORKSPACE_PATH}/harness-eval-report-card.json"

        if [ -f "${REPORT}" ]; then
          VERDICT=$(python3 -c "
        import json, sys
        with open(sys.argv[1]) as f:
            r = json.load(f)
        t = r.get('certification_tier', 'unknown')
        print({'hardened':'CLEAN','verified':'CLEAN','basic':'NEEDS_WORK','unknown':'UNKNOWN'}.get(t.lower(), 'BLOCKED'))
        " "${REPORT}" 2>/dev/null || echo "UNKNOWN")

          GRADE=$(python3 -c "
        import json, sys
        with open(sys.argv[1]) as f:
            r = json.load(f)
        print(r.get('grade', 'N/A'))
        " "${REPORT}" 2>/dev/null || echo "N/A")
        else
          VERDICT="UNKNOWN"
          GRADE="N/A"
        fi

        printf "%s" "${VERDICT}" > $(results.verdict.path)
        printf "%s" "${GRADE}" > $(results.grade.path)
        echo "Verdict: ${VERDICT} | Grade: ${GRADE}"
