name: "harness-eval"
description: "Check AI agent setups (instructions, skills, commands, hooks, settings, MCP configs, agents, harnesses): autonomy check for auto-merge, validated gate, security scan, quality lint. 93 deterministic rules, no LLM required."
author: "redhat-community-ai-tools"

branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Directories to scan, one per line. Default scans the repo root."
    default: "."
  preset:
    description: "Severity preset for the lint step: recommended or strict"
    default: "recommended"
  autonomy:
    description: "Run harness-autonomy (block and policy rules at gating or provisional tier; fails on FAIL and on REVIEW_REQUIRED). Set to 'false' to skip."
    default: "true"
  autonomy-policy:
    description: "Path of a trusted policy file passed to harness-autonomy --policy (accepted policy findings become waived)."
    default: ""
  autonomy-allow-review:
    description: "Treat REVIEW_REQUIRED (exit 2) as success for the autonomy step; the findings still appear in the output. Default fails on it."
    default: "false"
  autonomy-changed-only:
    description: "On pull requests, compare against the PR base so only findings the change introduced decide the verdict; pre-existing ones are listed, not counted. Set to 'false' to judge the whole tree."
    default: "true"
  gate:
    description: "Run the validated gate (harness-gate: gating-tier rules only, exits 1 on any finding, no LLM). Set to 'false' to skip."
    default: "true"
  gate-include-provisional:
    description: "Include provisional-tier rules in the gate."
    default: "false"
  security-gate:
    description: "Run security scan (--fail-on-warning). Set to 'false' to skip."
    default: "true"
  lint-gate:
    description: "Run the quality lint (--fail-on-error). Set to 'false' to skip."
    default: "true"
  lint-all:
    description: "Pass --all to harness-lint so every rule runs, not only advice rules."
    default: "false"
  lint-fail-on:
    description: "Lint failure threshold: 'error' (default) or 'warning' (strict)"
    default: "error"
  sarif:
    description: "Upload SARIF to GitHub Code Scanning for inline PR annotations"
    default: "true"
  comment:
    description: "Post a summary comment on pull requests"
    default: "true"
  recursive:
    description: "Recursively search for agent configs in all subdirectories"
    default: "false"
  exclude:
    description: "Glob patterns to exclude from scanning, one per line"
    default: ""
  version:
    description: "harness-eval version to install (e.g. '5.0.0'). Leave empty for latest."
    default: ""

outputs:
  autonomy-verdict:
    description: "PASS, FAIL or REVIEW_REQUIRED from harness-autonomy (empty when skipped; for several paths, the worst verdict)"
    value: ${{ steps.autonomy.outputs.verdict }}
  autonomy-passed:
    description: "Whether the autonomy step passed"
    value: ${{ steps.autonomy.outcome == 'success' || inputs.autonomy != 'true' }}
  gate-passed:
    description: "Whether the validated gate passed"
    value: ${{ steps.gate.outcome == 'success' || inputs.gate != 'true' }}
  security-passed:
    description: "Whether the security gate passed"
    value: ${{ steps.security.outcome == 'success' || inputs.security-gate != 'true' }}
  lint-passed:
    description: "Whether the lint gate passed"
    value: ${{ steps.lint.outcome == 'success' || inputs.lint-gate != 'true' }}
  sarif-file:
    description: "Path to the SARIF output directory (if generated)"
    value: ${{ steps.sarif.outputs.sarif-dir }}

runs:
  using: "composite"
  steps:
    - name: Install harness-eval
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          pip install -q "harness-eval==${{ inputs.version }}"
        else
          pip install -q harness-eval
        fi
        echo "Installed: $(harness-eval --version)"

    - name: Autonomy check
      id: autonomy
      if: inputs.autonomy == 'true'
      shell: bash
      run: |
        echo "=== Harness Autonomy (decidable rules only) ==="
        recursive_flag=""
        if [ "${{ inputs.recursive }}" = "true" ]; then
          recursive_flag="--recursive"
        fi
        policy_flag=""
        if [ -n "${{ inputs.autonomy-policy }}" ]; then
          policy_flag="--policy ${{ inputs.autonomy-policy }}"
        fi
        exclude_flags=""
        while IFS= read -r pat; do
          pat=$(echo "$pat" | xargs)
          [ -z "$pat" ] && continue
          exclude_flags="$exclude_flags --exclude $pat"
        done <<< "${{ inputs.exclude }}"
        # On a pull request, judge the change: check out the base revision next to
        # the workspace and let harness-autonomy list what already existed there.
        base_dir=""
        base_sha="${{ github.event.pull_request.base.sha }}"
        if [ "${{ inputs.autonomy-changed-only }}" = "true" ] && [ -n "$base_sha" ] && git rev-parse --git-dir >/dev/null 2>&1; then
          base_dir="${{ runner.temp }}/harness-eval-base"
          if git fetch -q --depth=1 origin "$base_sha" 2>/dev/null && git worktree add -q --detach "$base_dir" "$base_sha" 2>/dev/null; then
            echo "Comparing against base $base_sha"
          else
            echo "::notice::Could not check out base $base_sha; judging the whole tree"
            base_dir=""
          fi
        fi
        worst=0
        json_dir="${{ runner.temp }}/harness-eval-autonomy"
        mkdir -p "$json_dir"
        i=0
        while IFS= read -r dir; do
          dir=$(echo "$dir" | xargs)
          [ -z "$dir" ] && continue
          compare_flag=""
          if [ -n "$base_dir" ] && [ -d "$base_dir/$dir" ]; then
            compare_flag="--compare $base_dir/$dir"
          fi
          set +e
          harness-eval harness-autonomy "$dir" $recursive_flag $policy_flag $compare_flag $exclude_flags --format json --output "$json_dir/autonomy-$i.json"
          rc=$?
          set -e
          python3 -c "import json; d=json.load(open('$json_dir/autonomy-$i.json')); print(d['verdict']); [print('  BLOCK', f['rule'], f['file'], f['message']) for f in d['blocking']]; [print('  POLICY', f['rule'], f['file'], f['message']) for f in d['policy']]; [print('  WAIVED', f['rule'], f['file'], f['accepted_by']['reason']) for f in d['waived']]; [print('  PRE-EXISTING', f['rule'], f['file']) for f in d.get('pre_existing', [])]" || true
          # exit 1 (FAIL) outranks exit 2 (REVIEW_REQUIRED)
          if [ $rc -eq 1 ] || [ $worst -eq 1 ]; then worst=1; elif [ $rc -ne 0 ]; then worst=$rc; fi
          i=$((i + 1))
        done <<< "${{ inputs.path }}"
        case $worst in
          0) verdict=PASS ;;
          1) verdict=FAIL ;;
          *) verdict=REVIEW_REQUIRED ;;
        esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "json-dir=$json_dir" >> "$GITHUB_OUTPUT"
        if [ $worst -eq 2 ] && [ "${{ inputs.autonomy-allow-review }}" = "true" ]; then
          exit 0
        fi
        exit $worst

    - name: Gate
      id: gate
      if: inputs.gate == 'true' && always()
      shell: bash
      run: |
        echo "=== Harness Gate (validated block rules) ==="
        recursive_flag=""
        if [ "${{ inputs.recursive }}" = "true" ]; then
          recursive_flag="--recursive"
        fi
        provisional_flag=""
        if [ "${{ inputs.gate-include-provisional }}" = "true" ]; then
          provisional_flag="--include-provisional"
        fi
        failed=0
        while IFS= read -r dir; do
          dir=$(echo "$dir" | xargs)
          [ -z "$dir" ] && continue
          set +e
          harness-eval harness-gate "$dir" $recursive_flag $provisional_flag
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            failed=1
          fi
        done <<< "${{ inputs.path }}"
        exit $failed

    - name: Security gate
      id: security
      if: inputs.security-gate == 'true' && always()
      shell: bash
      run: |
        echo "=== Security Scan ==="
        recursive_flag=""
        if [ "${{ inputs.recursive }}" = "true" ]; then
          recursive_flag="--recursive"
        fi
        exclude_flags=""
        while IFS= read -r pat; do
          pat=$(echo "$pat" | xargs)
          [ -z "$pat" ] && continue
          exclude_flags="$exclude_flags --exclude $pat"
        done <<< "${{ inputs.exclude }}"
        failed=0
        while IFS= read -r dir; do
          dir=$(echo "$dir" | xargs)
          [ -z "$dir" ] && continue
          set +e
          harness-eval harness-security "$dir" $recursive_flag $exclude_flags --fail-on-warning
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            failed=1
          fi
        done <<< "${{ inputs.path }}"
        exit $failed

    - name: Lint gate
      id: lint
      if: inputs.lint-gate == 'true' && always()
      shell: bash
      run: |
        echo "=== Lint Scan ==="
        fail_flag="--fail-on-error"
        if [ "${{ inputs.lint-fail-on }}" = "warning" ]; then
          fail_flag="--fail-on-warning"
        fi
        all_flag=""
        if [ "${{ inputs.lint-all }}" = "true" ]; then
          all_flag="--all"
        fi
        recursive_flag=""
        if [ "${{ inputs.recursive }}" = "true" ]; then
          recursive_flag="--recursive"
        fi
        exclude_flags=""
        while IFS= read -r pat; do
          pat=$(echo "$pat" | xargs)
          [ -z "$pat" ] && continue
          exclude_flags="$exclude_flags --exclude $pat"
        done <<< "${{ inputs.exclude }}"
        failed=0
        json_dir="${{ runner.temp }}/harness-eval-json"
        mkdir -p "$json_dir"
        i=0
        while IFS= read -r dir; do
          dir=$(echo "$dir" | xargs)
          [ -z "$dir" ] && continue
          harness-eval harness-lint "$dir" --preset "${{ inputs.preset }}" $all_flag $recursive_flag $exclude_flags --format json --output "$json_dir/lint-$i.json" || true
          set +e
          harness-eval harness-lint "$dir" --preset "${{ inputs.preset }}" $all_flag $recursive_flag $exclude_flags $fail_flag
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            failed=1
          fi
          i=$((i + 1))
        done <<< "${{ inputs.path }}"
        echo "json-dir=$json_dir" >> "$GITHUB_OUTPUT"
        exit $failed

    - name: Generate SARIF
      id: sarif
      if: inputs.sarif == 'true' && always()
      shell: bash
      run: |
        sarif_dir="${{ runner.temp }}/harness-eval-sarif"
        mkdir -p "$sarif_dir"
        recursive_flag=""
        if [ "${{ inputs.recursive }}" = "true" ]; then
          recursive_flag="--recursive"
        fi
        exclude_flags=""
        while IFS= read -r pat; do
          pat=$(echo "$pat" | xargs)
          [ -z "$pat" ] && continue
          exclude_flags="$exclude_flags --exclude $pat"
        done <<< "${{ inputs.exclude }}"
        total_results=0
        i=0
        while IFS= read -r dir; do
          dir=$(echo "$dir" | xargs)
          [ -z "$dir" ] && continue
          harness-eval harness-lint "$dir" --preset "${{ inputs.preset }}" --all $recursive_flag $exclude_flags --format sarif --output "$sarif_dir/results-$i.sarif" || true
          count=$(python3 -c "import json; d=json.load(open('$sarif_dir/results-$i.sarif')); print(len(d['runs'][0]['results']))" 2>/dev/null || echo "0")
          total_results=$((total_results + count))
          i=$((i + 1))
        done <<< "${{ inputs.path }}"
        echo "sarif-dir=$sarif_dir" >> "$GITHUB_OUTPUT"
        echo "total-results=$total_results" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: inputs.sarif == 'true' && always() && steps.sarif.outputs.sarif-dir != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.sarif.outputs.sarif-dir }}
        category: harness-eval

    - name: Build PR comment
      id: comment-body
      if: inputs.comment == 'true' && always() && github.event_name == 'pull_request'
      shell: bash
      run: |
        json_dir="${{ steps.lint.outputs.json-dir }}"
        sarif_results="${{ steps.sarif.outputs.total-results }}"
        ver=$(harness-eval --version 2>&1 | grep -oP '[\d.]+' || echo "unknown")

        # Build component and category tables from JSON
        details=$(python3 << 'PYEOF'
        import json, glob, os, sys

        json_dir = os.environ.get("JSON_DIR", "")
        files = sorted(glob.glob(f"{json_dir}/lint-*.json")) if json_dir else []

        components = []
        categories = {}
        total_errors = 0
        total_warnings = 0

        for f in files:
            try:
                d = json.load(open(f))
            except Exception:
                continue
            inspection = d.get("inspection", {})
            summary = inspection.get("summary", {})
            total_errors += summary.get("errors", 0)
            total_warnings += summary.get("warnings", 0)

            for type_key in inspection:
                if type_key == "summary":
                    continue
                for comp in inspection[type_key]:
                    name = comp.get("name", "unknown")
                    rules_checked = len(comp.get("rules", []))
                    findings = comp.get("errors", 0) + comp.get("warnings", 0)
                    status = "✓" if findings == 0 else f"✗ {findings}"
                    components.append((name, type_key, rules_checked, status))
                    for rule in comp.get("rules", []):
                        cat = rule["rule"].split("/")[0]
                        if cat not in categories:
                            categories[cat] = {"checked": 0, "passed": 0}
                        categories[cat]["checked"] += 1
                        if rule.get("result") == "pass":
                            categories[cat]["passed"] += 1

        lines = []
        lines.append(f"total_errors={total_errors}")
        lines.append(f"total_warnings={total_warnings}")

        if components:
            lines.append("COMP_TABLE_START")
            for name, ctype, rules, status in components:
                lines.append(f"| {name} | {ctype} | {rules} | {status} |")
            lines.append("COMP_TABLE_END")

        if categories:
            lines.append("CAT_TABLE_START")
            for cat in sorted(categories):
                c = categories[cat]
                result = "✓ clean" if c["checked"] == c["passed"] else f"✗ {c['checked'] - c['passed']} issues"
                lines.append(f"| {cat} | {c['checked']} | {result} |")
            lines.append("CAT_TABLE_END")

        print("\n".join(lines))
        PYEOF
        )

        total_errors=$(echo "$details" | grep "^total_errors=" | cut -d= -f2)
        total_warnings=$(echo "$details" | grep "^total_warnings=" | cut -d= -f2)

        auto_icon="✓"; auto_msg="${{ steps.autonomy.outputs.verdict }}"
        [ "${{ inputs.autonomy }}" != "true" ] && { auto_icon="○"; auto_msg="skipped"; }
        [ "${{ steps.autonomy.outcome }}" != "success" ] && [ "${{ inputs.autonomy }}" = "true" ] && auto_icon="✗"

        sec_icon="✓"; sec_msg="passed (policy + heuristic security rules)"
        [ "${{ inputs.security-gate }}" != "true" ] && { sec_icon="○"; sec_msg="skipped"; }
        [ "${{ steps.security.outcome }}" != "success" ] && [ "${{ inputs.security-gate }}" = "true" ] && { sec_icon="✗"; sec_msg="findings detected"; }

        warnings_note=""
        [ "${total_warnings:-0}" -gt 0 ] && warnings_note=", ${total_warnings} warnings (non-blocking)"
        lint_icon="✓"; lint_msg="passed (${total_errors:-0} errors${warnings_note})"
        [ "${{ inputs.lint-gate }}" != "true" ] && { lint_icon="○"; lint_msg="skipped"; }
        [ "${{ steps.lint.outcome }}" != "success" ] && [ "${{ inputs.lint-gate }}" = "true" ] && { lint_icon="✗"; lint_msg="${total_errors:-0} errors${warnings_note}"; }

        sarif_icon="✓"; sarif_msg="uploaded (${sarif_results:-0} findings)"
        [ "${{ inputs.sarif }}" != "true" ] && { sarif_icon="○"; sarif_msg="skipped"; }
        [ "${{ steps.sarif.outcome }}" != "success" ] && [ "${{ inputs.sarif }}" = "true" ] && { sarif_icon="✗"; sarif_msg="failed"; }

        # Build component table
        comp_table=""
        if echo "$details" | grep -q "COMP_TABLE_START"; then
            comp_rows=$(echo "$details" | sed -n '/COMP_TABLE_START/,/COMP_TABLE_END/p' | grep "^|")
            comp_count=$(echo "$comp_rows" | wc -l)
            comp_header="| Component | Type | Rules checked | Result |
        |---|---|---|---|"
            if [ "$comp_count" -le 8 ]; then
                comp_table="
        ### Scanned components

        ${comp_header}
        ${comp_rows}"
            else
                comp_table="
        <details><summary>Scanned components (${comp_count})</summary>

        ${comp_header}
        ${comp_rows}

        </details>"
            fi
        fi

        # Build category table
        cat_table=""
        if echo "$details" | grep -q "CAT_TABLE_START"; then
            cat_rows=$(echo "$details" | sed -n '/CAT_TABLE_START/,/CAT_TABLE_END/p' | grep "^|")
            cat_table="
        ### Rules by category

        | Category | Rules checked | Result |
        |---|---|---|
        ${cat_rows}"
        fi

        # Assemble final body
        body="## Harness Eval Results

        ${auto_icon} **Autonomy check** (decidable rules only): ${auto_msg}
        ${sec_icon} **Security checks**: ${sec_msg}
        ${lint_icon} **Lint checks**: ${lint_msg}
        ${sarif_icon} **Code scanning**: ${sarif_msg}
        ${comp_table}
        ${cat_table}

        ---
        *[harness-eval](https://github.com/redhat-community-ai-tools/harness-eval) v${ver} | 93 rules | lint preset: ${{ inputs.preset }}*"

        body=$(echo "$body" | sed 's/^        //')

        # Save to file to avoid quoting issues
        echo "$body" > "${{ runner.temp }}/harness-eval-comment.md"

      env:
        JSON_DIR: ${{ steps.lint.outputs.json-dir }}

    - name: Post PR comment
      if: inputs.comment == 'true' && always() && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        pr_number="${{ github.event.pull_request.number }}"

        existing=$(gh api "repos/${{ github.repository }}/issues/${pr_number}/comments" \
          --jq '.[] | select(.body | contains("Harness Eval Results")) | .id' 2>/dev/null || true)
        for cid in $existing; do
          gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$cid" 2>/dev/null || true
        done

        gh pr comment "$pr_number" --body-file "${{ runner.temp }}/harness-eval-comment.md"
