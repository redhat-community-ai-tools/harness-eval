name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format
        run: uv run ruff format --check src/ tests/

      - name: Mypy type check
        continue-on-error: true
        run: uv run mypy src/ --ignore-missing-imports

      - name: Command surface sync check
        run: uv run scripts/sync_commands.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deps: [core, full]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "full" ]; then
            uv sync --all-extras
          else
            uv sync --extra dev
          fi

      - name: Run tests with coverage
        run: uv run pytest -v --cov=src --cov-report=term-missing --cov-fail-under=70

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md updated
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if echo "$TITLE" | grep -qiE '^(feat|fix|refactor|perf|security)'; then
            if git diff --name-only origin/main...HEAD | grep -q '^CHANGELOG.md$'; then
              echo "CHANGELOG.md updated."
            else
              echo "::error::PR title starts with feat/fix/refactor/perf/security but CHANGELOG.md was not modified."
              echo "Add an entry under [Unreleased] in CHANGELOG.md."
              exit 1
            fi
          else
            echo "Skipping: PR title does not indicate a feature/fix commit."
          fi

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Security gate (block on security errors)
        run: uv run harness-eval harness-security . --fail-on-error

      - name: Lint gate (block on structural errors only)
        run: uv run harness-eval harness-lint . --fail-on-error
